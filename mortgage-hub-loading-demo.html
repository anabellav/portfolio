<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mortgage Hub · Personalising your home</title>
    <link rel="stylesheet" href="mortgage-hub-loading-demo.css">
    <script src="mortgage-hub-loading-demo.js" defer></script>
  </head>
  <body>
    <header class="loading-header">
      <div class="loading-header-inner">
        <img src="assets/mortgage-hub-loading/logo.svg" width="87.452" height="14" alt="Trussle">
        <div class="loading-account">
          <img src="assets/mortgage-hub-loading/avatar.svg" width="24" height="24" alt="">
          <span>Lily</span>
          <img src="assets/mortgage-hub-loading/chevron.svg" width="10" height="6" alt="">
        </div>
      </div>
    </header>
    <main class="loading-content">
      <h1>Personalising your ‘home’</h1>
      <div class="loading-illustration" aria-hidden="true">
        <img src="assets/mortgage-hub-loading/person.png" alt="" width="344" height="344">
      </div>
      <ol class="loading-steps" aria-label="Personalisation progress">
        <li data-state="active"><span class="step-marker" aria-hidden="true"><img class="pending-icon" src="assets/mortgage-hub-loading/pending.svg" width="16" height="16" alt=""><img class="complete-icon" src="assets/mortgage-hub-loading/complete.svg" width="16" height="16" alt=""><img class="tick-icon" src="assets/mortgage-hub-loading/tick.svg" width="7.273" height="5.091" alt=""></span><span>Checking your credit profile</span></li>
        <li data-state="pending"><span class="step-marker" aria-hidden="true"><img class="pending-icon" src="assets/mortgage-hub-loading/pending.svg" width="16" height="16" alt=""><img class="complete-icon" src="assets/mortgage-hub-loading/complete.svg" width="16" height="16" alt=""><img class="tick-icon" src="assets/mortgage-hub-loading/tick.svg" width="7.273" height="5.091" alt=""></span><span>Assessing your fit with lenders</span></li>
        <li data-state="pending"><span class="step-marker" aria-hidden="true"><img class="pending-icon" src="assets/mortgage-hub-loading/pending.svg" width="16" height="16" alt=""><img class="complete-icon" src="assets/mortgage-hub-loading/complete.svg" width="16" height="16" alt=""><img class="tick-icon" src="assets/mortgage-hub-loading/tick.svg" width="7.273" height="5.091" alt=""></span><span>Calculating your max borrowing power!</span></li>
      </ol>
    </main>
  </body>
</html>
